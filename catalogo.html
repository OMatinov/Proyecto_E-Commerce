<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tiendas Urbano - Catálogo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <div class="promo-bar">
      ENVÍO GRATIS A TODO CHILE DESDE $44.990
    </div>
    <div class="container">
      <header>
        <div class="brand">
          <div class="brand-logo">
            <img src="img/LogoTiendasUrbano.jpeg" alt="Logo Tiendas Urbano">
          </div>
          <div class="brand-text">
            <h1>Tiendas Urbano</h1>
            <p>CATÁLOGO</p>
          </div>
        </div>
        <!-- Menú de navegación unificado -->
        <nav class="main-nav">
          <a href="index.html">Inicio</a>
          <a href="catalogo.html" class="active">Catálogo</a>
          <a href="nosotros.html">Nosotros</a>
          <a href="blogs.html">Blogs</a>
          <a href="contacto.html">Contacto</a>
          <a href="inicio-sesion.html">Iniciar sesión</a>
          <a href="checkout.html">Carrito (<span id="cart-count">0</span>)</a>
        </nav>
      </header>

      <!-- Filtros de Género -->
      <div class="gender-filters">
        <button class="filter-gender active" data-gender="todos">Todos</button>
        <button class="filter-gender" data-gender="mujer">Mujer</button>
        <button class="filter-gender" data-gender="hombre">Hombre</button>
      </div>

      <!-- Filtros de Categoría -->
      <section class="catalog-toolbar section">
        <div class="catalog-filters">
          <button class="filter-button active" data-category="todos">Todos</button>
          <button class="filter-button" data-category="abrigos">Abrigos</button>
          <button class="filter-button" data-category="accesorios">Accesorios</button>
          <button class="filter-button" data-category="calzado">Calzado</button>
          <button class="filter-button" data-category="chaquetas">Chaquetas</button>
          <button class="filter-button" data-category="conjuntos">Conjuntos</button>
          <button class="filter-button" data-category="faldas">Faldas</button>
          <button class="filter-button" data-category="pantalones">Pantalones</button>
          <button class="filter-button" data-category="poleras">Poleras</button>
          <button class="filter-button" data-category="polerones">Polerones</button>
          <button class="filter-button" data-category="shorts">Shorts</button>
          <button class="filter-button" data-category="sueters">Suéters</button>
          <button class="filter-button" data-category="vestidos">Vestidos</button>
        </div>
      </section>

      <!-- Grid de Productos Dinámico -->
      <section class="section">
        <div class="product-grid" id="product-grid">
          <!-- Se llena con JavaScript -->
        </div>
      </section>
    </div>

    <footer>
      <div class="footer-content">
        <span>© 2025 Tiendas Urbano Online. Moda urbana femenina en Chile.</span>
        <div class="footer-links">
          <a href="#">Cómo comprar</a>
          <a href="#">Cambios y devoluciones</a>
          <a href="#">Tiempos y costos de despacho</a>
          <a href="#">Medios de pago</a>
        </div>
      </div>
    </footer>
  </main>

  <!-- Scripts -->
  <script src="cart.js"></script>
  <script src="productos.js"></script>
  <script>
    // Actualizar contador del carrito
    document.getElementById("cart-count").textContent =
      getCart().reduce((total, item) => total + item.qty, 0);

    // Lógica de renderizado y filtros
    (function() {
      const grid = document.getElementById('product-grid');
      const filterButtons = document.querySelectorAll('.filter-button');
      const genderButtons = document.querySelectorAll('.filter-gender');

      let categoriaActual = 'todos';
      let generoActual = 'todos';

      function renderizar() {
        let filtrados = productos;

        if (categoriaActual !== 'todos') {
          filtrados = filtrados.filter(p => p.categoria === categoriaActual);
        }
        if (generoActual !== 'todos') {
          filtrados = filtrados.filter(p => p.genero === generoActual);
        }

        grid.innerHTML = '';
        if (filtrados.length === 0) {
          grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:40px; color:#666;">No hay productos que coincidan con los filtros.</p>';
          return;
        }

        filtrados.forEach(p => {
          const enlace = document.createElement('a');
          enlace.href = `producto.html?id=${p.id}`;
          enlace.className = 'product-card-link';

          const card = document.createElement('article');
          card.className = 'product-card';

          card.innerHTML = `
            <div class="product-card-image">
              <img src="${p.imagen}" alt="${p.nombre}">
            </div>
            <div class="product-body">
              <p class="product-category">${p.categoria}</p>
              <h4 class="product-name">${p.nombre}</h4>
              <p class="product-price">$${p.precio.toLocaleString('es-CL')}</p>
            </div>
          `;

          enlace.appendChild(card);
          grid.appendChild(enlace);
        });
      }

      // Eventos de categoría
      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          filterButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          categoriaActual = btn.dataset.category;
          renderizar();
          const y = grid.getBoundingClientRect().top + window.scrollY - 160;
          window.scrollTo({ top: y, behavior: 'smooth' });
        });
      });

      // Eventos de género
      genderButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          genderButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          generoActual = btn.dataset.gender;
          renderizar();
        });
      });

      renderizar();
    })();
  </script>
</body>
</html>
