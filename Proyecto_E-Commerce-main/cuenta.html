<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tiendas Urbano - Mi cuenta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-logo">
          <img src="img/LogoTiendasUrbano.jpeg" alt="Logo Tiendas Urbano">
        </div>
        <div class="brand-text">
          <h1>Tiendas Urbano</h1>
          <p>Cuenta de usuaria registrada</p>
        </div>
      </div>
      <div class="login-link">
        <a href="index.html" id="linkCerrarSesion">Cerrar sesión</a>
      </div>
    </header>

    <div class="welcome-banner">
      <img src="img/bienvenida1.png" alt="">
    </div>

    <section class="section">

      <h3 id="tituloBienvenida">Bienvenida</h3>
      <ul style="margin-top:10px; font-size:0.9rem;" id="datosUsuario">
        <!-- Los datos se insertan aquí con JS -->
      </ul>
      <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
        <a class="btn-primary" href="catalogo.html">Ir al catálogo</a>
      </div>
    </section>
  </div>

  <footer>
    <div class="footer-content">
      <div>© 2025 Tiendas Urbano Online. Moda urbana femenina en Chile.</div>
      <div class="footer-links">
        <a href="#">Cómo comprar</a>
        <a href="#">Cambios y devoluciones</a>
        <a href="#">Tiempos y costos de despacho</a>
        <a href="#">Medios de pago</a>
      </div>
    </div>
  </footer>

  <script>
    function renderCuenta() {
      const datos = localStorage.getItem("tiendaUrbanoUsuario");
      const titulo = document.getElementById("tituloBienvenida");
      const lista = document.getElementById("datosUsuario");

      if (!datos) {
        // Nadie se ha registrado todavía en este navegador
        titulo.textContent = "No hay una cuenta registrada";
        lista.innerHTML = `
          <li>Aún no tienes datos guardados.</li>
          <li><a href="registro.html">Regístrate aquí</a> para crear tu cuenta.</li>
        `;
        return;
      }

      const usuario = JSON.parse(datos);

      titulo.textContent = `Bienvenida, ${usuario.nombre}`;
      lista.innerHTML = `
        <li><strong>RUN:</strong> ${usuario.run}</li>
        <li><strong>Correo registrado:</strong> ${usuario.correo}</li>
        <li><strong>Teléfono:</strong> ${usuario.telefono || "No indicado"}</li>
        <li><strong>Región:</strong> ${usuario.region}</li>
        <li><strong>Comuna:</strong> ${usuario.comuna}</li>
        <li><strong>Tipo de usuario:</strong> ${usuario.tipoUsuario}</li>
      `;
    }

    renderCuenta();

    document.getElementById("linkCerrarSesion").addEventListener("click", () => {
      localStorage.removeItem("tiendaUrbanoUsuario");
    });
  </script>
</body>
</html>
