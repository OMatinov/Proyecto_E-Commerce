server:
  port: 8083

spring:
  application:
    name: ms-boletas
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/grwu_boletas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:grwu}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  issuer: grwu-auth

pasarela:
  probabilidad-rechazo: ${PASARELA_PROBABILIDAD_RECHAZO:0.10}
  limite-monto: ${PASARELA_LIMITE_MONTO:100000}

servicios:
  catalogo:
    url: ${CATALOGO_URL:http://localhost:8082/api/v1}
    service-key: ${SERVICE_KEY}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html