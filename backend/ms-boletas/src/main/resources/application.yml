server:
  port: 8083

spring:
  application:
    name: ms-boletas
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/grwu_boletas?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:grwu}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  # Sin valor por defecto a propósito: debe ser IDÉNTICA en los 3 servicios (mínimo 32 caracteres).
  secret: ${JWT_SECRET}
  issuer: grwu-auth

pasarela:
  probabilidad-rechazo: 0.10
  limite-monto: 100000

servicios:
  catalogo:
    url: http://localhost:8082/api/v1
    service-key: ${SERVICE_KEY:clave-interna-grwu}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html