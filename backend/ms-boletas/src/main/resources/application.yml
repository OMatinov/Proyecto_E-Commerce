server:
  port: 8083

spring:
  application:
    name: ms-boletas
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/grwu_boletas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  issuer: grwu-auth

pasarela:
  probabilidad-rechazo: ${PASARELA_PROBABILIDAD_RECHAZO:0.10}
  limite-monto: ${PASARELA_LIMITE_MONTO:100000}

servicios:
  catalogo:
    url: ${CATALOGO_URL:http://localhost:8082/api/v1}
    service-key: ${SERVICE_KEY}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html